name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-version-guard:
    # Plugin content reaches installed users only when they reinstall or update,
    # and the version they compare against is the package version in
    # pyproject.toml — a PR that changes plugin content without raising it
    # leaves every existing install looking current.
    name: Plugin version bumped when plugin content changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require version bump for plugin-content changes
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch -q origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- skills/ agents/ commands/ hooks/ .opencode/ .qwen/ | wc -l)
          if [ "$CHANGED" -eq 0 ]; then
            echo "No plugin content changed; guard passes."
            exit 0
          fi
          if git diff "$BASE"...HEAD -- pyproject.toml | grep -q '^+version = '; then
            echo "Plugin content changed and the version was bumped; guard passes."
            exit 0
          fi
          echo "::error::plugin content changed but the package version did not."
          echo "Raise [project].version in pyproject.toml and add a CHANGELOG section, or installed users never receive this change."
          exit 1

  plugin-trees-current:
    # .opencode/ and .qwen/ are generated from the canonical plugin source by
    # scripts/build_plugin_targets.py. If they are committed stale, clients read
    # a different plugin than the source of truth.
    name: Generated client plugin trees match the canonical source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check generated trees
        run: python scripts/build_plugin_targets.py --check

  package-version-guard:
    # Apps that install these tools (Patent Creator Studio among them) decide
    # whether an installed copy is current by comparing the package version.
    # A PR that changes what gets installed without raising the version in
    # pyproject.toml would leave every existing install looking current.
    # Dependabot is exempt: its PRs only raise other libraries' minimum
    # versions, which a same-version reinstall would not pick up anyway; the
    # next real version carries them.
    name: Package version raised when installed code changes
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require a version bump for installed-code changes
        run: |
          pip install -q packaging
          git fetch -q origin "${{ github.base_ref }}"
          python scripts/check_package_version.py "origin/${{ github.base_ref }}"

  lint-and-test:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Compile-check the package
        run: python -m compileall -q mcp_server skills scripts setup.py

      - name: Run tests
        env:
          PATENT_LOG_LEVEL: WARNING
        run: pytest tests/ -q
